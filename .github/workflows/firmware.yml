name: Firmware

on:
  push:
    branches: [master]
    tags: ["ewp-*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ESP32-C3 firmware
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.pio-core
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/firmware.yml

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            .pio-core
            .pio/libdeps
          key: ${{ runner.os }}-platformio-6.2-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-6.2-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Compile firmware
        run: pio run --environment ErsaWearable

      - name: Package firmware images
        run: python scripts/package_firmware.py

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ewp-firmware-${{ github.sha }}
          path: |
            .pio/release/firmware.bin
            .pio/release/ewp-factory.bin
            .pio/release/SHA256SUMS
            .pio/release/FLASHING.md
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/ewp-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: ewp-firmware-${{ github.sha }}
          path: .pio/release

      - name: Create release and attach firmware
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            .pio/release/firmware.bin
            .pio/release/ewp-factory.bin
            .pio/release/SHA256SUMS
            .pio/release/FLASHING.md
