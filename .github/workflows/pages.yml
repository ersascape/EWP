name: Deploy Companion to GitHub Pages

on:
  push:
    branches:
      - master
    tags:
      - 'ewp-*'
    paths:
      - 'docs/**'
      - 'companion/**'
      - 'packaging/arch/**'
      - 'scripts/package_ewctl_arch.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble documentation and Arch repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .site/arch/x86_64
          cp -a docs/. .site/
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == ewp-* ]]; then
            ./scripts/package_ewctl_arch.sh
            cp .pio/release/ewctl* .site/arch/x86_64/
          else
            gh release download --repo "$GITHUB_REPOSITORY" \
              --pattern 'ewctl*' --dir .site/arch/x86_64 || \
              echo 'No ewctl package in the latest release yet; publishing docs only.'
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
