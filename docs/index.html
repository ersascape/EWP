<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ersa Wearable — Web Bluetooth Companion</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #16191f;
      --border: #262c36;
      --text: #f0f3f6;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --danger: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      line-height: 1.5;
      max-width: 680px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: var(--text-muted); font-size: 14px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .card h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-disconnected { background: #30363d; color: var(--text-muted); }
    .badge-connected { background: #238636; color: #fff; }
    button {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover { background: #30363d; border-color: #8b949e; }
    button.primary { background: #1f6feb; border-color: #388bfd; color: #fff; }
    button.primary:hover { background: #388bfd; }
    button.danger { background: #b62324; border-color: #e5534b; color: #fff; }
    button.danger:hover { background: #da3633; }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }
    input {
      width: 100%;
      background: #0d0f12;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    #log {
      background: #090a0d;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      height: 180px;
      overflow-y: auto;
      color: #7ee787;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ersa Wearable Companion</h1>
    <div class="subtitle">Direct Web Bluetooth link for Media & Call Sync</div>
  </header>

  <div class="card">
    <h2>
      Connection
      <span id="connBadge" class="badge badge-disconnected">Disconnected</span>
    </h2>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button id="btnConnect" class="primary">Connect Watch</button>
      <button id="btnDisconnect" style="display: none;" class="danger">Disconnect</button>
      <span id="devInfo" style="font-size: 13px; color: var(--text-muted);"></span>
    </div>
  </div>

  <div class="card">
    <h2>Now Playing Media</h2>
    <div class="form-group">
      <label>Track Title</label>
      <input type="text" id="trackTitle" value="Starboy" placeholder="Title" />
    </div>
    <div class="form-group">
      <label>Artist</label>
      <input type="text" id="trackArtist" value="The Weeknd" placeholder="Artist" />
    </div>
    <div class="btn-row">
      <button id="btnSendPlaying" class="primary">Update Track (Playing)</button>
      <button id="btnSendPaused">Send Paused</button>
    </div>
  </div>

  <div class="card">
    <h2>Simulate Phone Call</h2>
    <div class="form-group">
      <label>Caller Name</label>
      <input type="text" id="callerName" value="Alice Smith" placeholder="Name" />
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" id="callerNumber" value="+1 (555) 019-2831" placeholder="Number" />
    </div>
    <div class="btn-row">
      <button id="btnTriggerCall" class="primary">Incoming Call</button>
      <button id="btnEndCall" class="danger">End / Hang Up</button>
    </div>
  </div>

  <div class="card">
    <h2>Event & Button Activity Log</h2>
    <div id="log">Ready to connect via Web Bluetooth. Click 'Connect Watch' above.&#10;</div>
  </div>

  <script>
    const SERVICE_UUID  = '0000ffe0-0000-1000-8000-00805f9b34fb';
    const CHAR_CALL_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';
    const CHAR_MEDIA_UUID= '0000ffe2-0000-1000-8000-00805f9b34fb';
    const CHAR_REC_UUID  = '0000ffe3-0000-1000-8000-00805f9b34fb';

    let bluetoothDevice = null;
    let callChar = null;
    let mediaChar = null;
    let recentsChar = null;

    const logBox = document.getElementById('log');
    const connBadge = document.getElementById('connBadge');
    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const devInfo = document.getElementById('devInfo');

    function log(msg) {
      const ts = new Date().toLocaleTimeString();
      logBox.textContent += `[${ts}] ${msg}\n`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    btnConnect.addEventListener('click', async () => {
      try {
        log('Requesting Bluetooth Device with Ersa service...');
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Ersa Wearable' }],
          optionalServices: [SERVICE_UUID, 'battery_service', 'device_information']
        });

        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log(`Connecting to GATT Server on ${bluetoothDevice.name}...`);
        const server = await bluetoothDevice.gatt.connect();

        log('Getting Ersa Primary Service...');
        const service = await server.getPrimaryService(SERVICE_UUID);

        log('Getting characteristics...');
        callChar = await service.getCharacteristic(CHAR_CALL_UUID);
        mediaChar = await service.getCharacteristic(CHAR_MEDIA_UUID);
        try { recentsChar = await service.getCharacteristic(CHAR_REC_UUID); } catch(e) {}

        // Listen for watch button events on Call Characteristic
        await callChar.startNotifications();
        callChar.addEventListener('characteristicvaluechanged', (e) => {
          const val = new Uint8Array(e.target.value.buffer);
          const action = val[0];
          if (action === 1) {
            log('WATCH ACTION -> B1 ACCEPT CALL pressed on watch!');
          } else if (action === 2) {
            log('WATCH ACTION -> B2 DECLINE / HANGUP pressed on watch!');
          } else if (action === 3) {
            const dec = new TextDecoder().decode(val.slice(1));
            log(`WATCH ACTION -> QUICK DIAL RECENT requested from watch: ${dec}`);
          }
        });

        // Listen for watch button events on Media Characteristic
        await mediaChar.startNotifications();
        mediaChar.addEventListener('characteristicvaluechanged', (e) => {
          const val = new Uint8Array(e.target.value.buffer);
          const cmd = val[0];
          const actions = ['Play', 'Pause', 'Toggle Play/Pause (B2)', 'Next Track (B1)', 'Previous Track (Hold B2)'];
          log(`WATCH MEDIA ACTION -> ${actions[cmd] || 'Command ' + cmd}`);
        });

        connBadge.className = 'badge badge-connected';
        connBadge.textContent = 'Connected';
        btnConnect.style.display = 'none';
        btnDisconnect.style.display = 'inline-block';
        devInfo.textContent = `Connected to: ${bluetoothDevice.name} (${bluetoothDevice.id})`;
        log('Connected successfully! You can now send media and call alerts to the watch.');

        // Send current now playing
        sendMedia(true);
      } catch (err) {
        log(`Connection failed: ${err.message}`);
      }
    });

    btnDisconnect.addEventListener('click', () => {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
      }
    });

    function onDisconnected() {
      connBadge.className = 'badge badge-disconnected';
      connBadge.textContent = 'Disconnected';
      btnConnect.style.display = 'inline-block';
      btnDisconnect.style.display = 'none';
      devInfo.textContent = '';
      log('Watch disconnected.');
    }

    async function sendMedia(playing) {
      if (!mediaChar) { log('Error: Not connected'); return; }
      const title = document.getElementById('trackTitle').value || 'Unknown';
      const artist = document.getElementById('trackArtist').value || 'Unknown';
      const payload = `${title}\t${artist}`;
      const enc = new TextEncoder().encode(payload);
      const data = new Uint8Array(1 + enc.length);
      data[0] = playing ? 1 : 0;
      data.set(enc, 1);
      await mediaChar.writeValue(data);
      log(`Sent Media: ${playing ? 'PLAYING' : 'PAUSED'} "${title}" by ${artist}`);
    }

    document.getElementById('btnSendPlaying').addEventListener('click', () => sendMedia(true));
    document.getElementById('btnSendPaused').addEventListener('click', () => sendMedia(false));

    document.getElementById('btnTriggerCall').addEventListener('click', async () => {
      if (!callChar) { log('Error: Not connected'); return; }
      const name = document.getElementById('callerName').value || 'Caller';
      const number = document.getElementById('callerNumber').value || '';
      const payload = `${name}\t${number}`;
      const enc = new TextEncoder().encode(payload);
      const data = new Uint8Array(1 + enc.length);
      data[0] = 0; // 0 = Incoming
      data.set(enc, 1);
      await callChar.writeValue(data);
      log(`Triggered Incoming Call alert: "${name}" (${number})`);
    });

    document.getElementById('btnEndCall').addEventListener('click', async () => {
      if (!callChar) { log('Error: Not connected'); return; }
      const data = new Uint8Array([3]); // 3 = Ended
      await callChar.writeValue(data);
      log('Sent Call Ended event to watch.');
    });
  </script>
</body>
</html>
